server {
    listen 80;
    server_name _;
    root /var/www/html/frontend/dist;
    index index.html;

    charset utf-8;

    # 文本资源 gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/xml+rss text/javascript image/svg+xml font/ttf font/otf font/woff2;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;

    # xray 节点 WS 长连接（agent 主通道；Go 内置）
    location /node-ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # xray 节点资产与安装脚本（Go 后端动态提供）
    location ~ ^/(node-install\.sh|node-agent\.sh|node-bin/) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 路由（Go 后端）
    location ~ ^/(api|admin-api) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 入口：绝不能缓存
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全：禁止访问敏感文件
    location ~* \.(env|git|htaccess) {
        return 404;
    }

    # 静态资源缓存（哈希文件名，可长缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
